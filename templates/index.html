<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viikko 5 – LLM Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <h1>Paikallinen tekoälychat</h1>
            <p>Keskustele palvelimella toimivan kielimallin kanssa.</p>
        </header>

        <section id="chat" class="chat" aria-live="polite">
            <div class="message assistant">
                Hei! Olen paikallinen tekoälyavustaja. Miten voin auttaa?
            </div>
        </section>

        <form id="chat-form">
            <label for="message">Kirjoita viestisi</label>
            <div class="input-row">
                <input
                    type="text"
                    id="message"
                    name="message"
                    maxlength="4000"
                    placeholder="Kirjoita viesti..."
                    autocomplete="off"
                    required
                >
                <button type="submit" id="send-button">Lähetä</button>
            </div>
        </form>

        <p id="status" role="status"></p>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
